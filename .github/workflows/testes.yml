name: Testes

# Roda a suíte a cada push e em cada pull request. Não precisa de banco nem de
# credenciais: os testes usam conexão simulada.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # O requirements.txt aceita pandas 2 e 3; o Railway pode instalar
        # qualquer uma das duas, então as duas precisam passar.
        include:
          # 3.11 é o que o Railway/nixpacks costuma usar em produção.
          - rotulo: "py3.11 · pandas 2.x"
            python: "3.11"
            spec: "pandas>=2.2,<3"
          - rotulo: "py3.11 · pandas 3.x"
            python: "3.11"
            spec: "pandas>=3,<4"
          - rotulo: "py3.12 · pandas 2.x"
            python: "3.12"
            spec: "pandas>=2.2,<3"
          - rotulo: "py3.12 · pandas 3.x"
            python: "3.12"
            spec: "pandas>=3,<4"

    name: ${{ matrix.rotulo }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "${{ matrix.spec }}"

      - name: Conferir versões instaladas
        run: python -c "import pandas, streamlit; print('pandas', pandas.__version__, '| streamlit', streamlit.__version__)"

      - name: Análise estática
        run: python -m pyflakes financeiro.py keepalive.py tests/

      - name: Suíte de testes
        run: python tests/rodar_todos.py
