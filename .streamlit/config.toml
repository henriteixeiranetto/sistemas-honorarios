[runner]
magicEnabled = false

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

# Paleta da marca Maciel Freitas Advocacia (extraida de gmfreitas.com.br).
[theme]
base                     = "light"
primaryColor             = "#035E70"
backgroundColor          = "#FBFAF7"
secondaryBackgroundColor = "#F2EFE8"
textColor                = "#1C2A2E"

[client]
# Nao vazar stack trace do Python para a tela do usuario em producao.
showErrorDetails = false
